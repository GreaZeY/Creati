  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:alpine
    container_name: creati-redis-cache
    ports:
      - "6381:6379"
    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis_cache_data:/data

  redis-queue:
    image: redis:alpine
    container_name: creati-redis-queue
    ports:
      - "6380:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis_queue_data:/data

volumes:
  # postgres_data:
  redis_cache_data:
  redis_queue_data:
