root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main.exe ./cmd/app/main.go"
bin = "./tmp/main.exe"
include_ext = ["go"]
include_file = [".env"]
exclude_dir = ["tmp", "vendor", "logs", "storage", "internal/db/migrations"]

[log]
time = true
main_only = false

[misc]
clean_on_exit = true
